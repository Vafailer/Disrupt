name: Temporary contract diff
on:
  push:
    branches: [tmp/encryption-debug]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: notes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NOTES_PROVIDER: mock
      NOTES_ALLOW_LIVE_REQUESTS: "false"
      TEST_POSTGRES_URL: postgresql+psycopg://notes:ci-only-password@127.0.0.1:5432/notes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: |
          python -m pytest -q --maxfail=40 -rfE --tb=short -p no:cacheprovider > out.txt 2>&1 || true
          python .github/ann.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/w" --no-audit --no-fund --ignore-scripts jsdom@26.0.0
      - run: |
          for t in web_structure web_admin web_admin_session web_audio web_reminders web_brain web_focus; do echo "== $t"; for k in 1; do NODE_PATH=$RUNNER_TEMP/w/node_modules timeout 90 node tests/$t.cjs; echo "exit $?"; done; done > js.txt 2>&1 || true
          python -c "import re;d=open('js.txt').read();keep=[l for l in d.splitlines() if re.search(r'passed|^==|^exit|AssertionError|Error:|at .*web_.*cjs|expected|actual',l) and 'node_modules' not in l];print('::error title=jsdom::'+'%0A'.join(keep[-80:]).replace('%','%25').replace('%250A','%0A'))"

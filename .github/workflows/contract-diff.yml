name: Temporary contract diff
on:
  push:
    branches: [tmp/ci-debug-4]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: notes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NOTES_PROVIDER: mock
      NOTES_ALLOW_LIVE_REQUESTS: "false"
      TEST_POSTGRES_URL: postgresql+psycopg://notes:ci-only-password@127.0.0.1:5432/notes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: |
          echo skip > out.txt
          python -c "import re;d=open('out.txt').read();i=d.find('= FAILURES =');s=d[i:] if i>=0 else d;s=s[-60000:];print('::error title=pytest::'+s.replace('%','%25').replace('\r','').replace('\n','%0A'))"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/w" --no-audit --no-fund --ignore-scripts jsdom@26.0.0
      - run: |
          for t in web_reminders; do echo "== $t"; for k in 1 2 3 4 5; do NODE_PATH=$RUNNER_TEMP/w/node_modules timeout 90 node tests/$t.cjs; echo "exit $?"; done; done > js.txt 2>&1 || true
          python -c "d=open('js.txt').read()[-30000:];print('::error title=jsdom::'+d.replace('%','%25').replace('\r','').replace('\n','%0A'))"

name: Temporary osv scan
on:
  push:
    branches: [tmp/security-scan]
permissions:
  contents: read
jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner --version
          ./osv-scanner scan source -r . > osv.txt 2>&1; echo "exit $?" >> osv.txt
          python3 -c "d=open('osv.txt').read();print('::error title=osv::'+d[-6000:].replace('%','%25').replace('\r','').replace('\n','%0A'))"

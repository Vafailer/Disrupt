name: Backend tests without AI credentials
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: notes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NOTES_PROVIDER: mock
      NOTES_ALLOW_LIVE_REQUESTS: "false"
      TEST_POSTGRES_URL: postgresql+psycopg://notes:ci-only-password@127.0.0.1:5432/notes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -version && ffprobe -version
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check app tests migrations scripts telegram_adapter
      - name: Check generated contract
        run: |
          PYTHONPATH=. python scripts/export_contract.py
          git diff --exit-code -- docs/integration-v1.openapi.json docs/integration-v1.yaml docs/integration-v1-examples.json
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/static/app.js
      - run: node --check app/static/reminders.js
      - run: node --check app/static/admin.js
      - run: npm install --prefix "$RUNNER_TEMP/beresta-web-tests" --no-audit --no-fund --ignore-scripts jsdom@26.0.0
      - run: node tests/web_structure.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/beresta-web-tests/node_modules
      - run: node tests/web_admin.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/beresta-web-tests/node_modules
      - run: node tests/web_audio.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/beresta-web-tests/node_modules
      - run: node tests/web_reminders.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/beresta-web-tests/node_modules
      - run: python -m alembic upgrade head
      - run: python -m alembic check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check current image and audio volume
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f deploy/compose.telegram.yaml --profile telegram config --quiet
          APP_DOMAIN=example.invalid docker compose -f compose.production.yaml -f deploy/compose.telegram.yaml --profile telegram config --quiet
          docker build -t beresta-audio-check .
          docker run --rm beresta-audio-check ffmpeg -version
          docker run --rm beresta-audio-check ffprobe -version
          docker run --rm beresta-audio-check sh -c 'test -w /app/data/audio && test "$(id -u)" != 0'
          docker build -f deploy/Dockerfile.telegram -t beresta-telegram-check .
          docker run --rm beresta-telegram-check python -m telegram_adapter --demo

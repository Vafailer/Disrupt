name: Backend tests without AI credentials
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: notes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NOTES_PROVIDER: mock
      NOTES_ALLOW_LIVE_REQUESTS: "false"
      TEST_POSTGRES_URL: postgresql+psycopg://notes:ci-only-password@127.0.0.1:5432/notes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Read pinned colleague adapter without merging branches
        run: |
          git fetch --no-tags origin c63c3168aea59fb6d1c5dc50fd958346d43405c3
          mkdir -p "$RUNNER_TEMP/beresta-telegram-adapter"
          git archive c63c3168aea59fb6d1c5dc50fd958346d43405c3 telegram_adapter | tar -x -C "$RUNNER_TEMP/beresta-telegram-adapter"
      - run: python -m ruff check app tests migrations
      - name: Check generated contract
        run: |
          PYTHONPATH=. python scripts/export_contract.py
          git diff --exit-code -- docs/integration-v1.openapi.json docs/integration-v1.yaml docs/integration-v1-examples.json
      - run: python -m pytest -q
        env:
          TEST_TELEGRAM_ADAPTER_PATH: ${{ runner.temp }}/beresta-telegram-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/static/app.js
      - run: npm install --prefix "$RUNNER_TEMP/beresta-web-tests" --no-audit --no-fund --ignore-scripts jsdom@26.0.0
      - run: node tests/web_structure.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/beresta-web-tests/node_modules
      - run: python -m alembic upgrade head
      - run: python -m alembic check

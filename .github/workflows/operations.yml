name: Encrypted backup and isolated recovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y age openssh-server
      - run: python -m pip install ruff==0.11.13
      - run: python -m ruff check deploy/ops tests/test_operations.py
      - name: Backup, recovery, health and ingress on disposable mock stack
        run: bash deploy/ops/test_recovery.sh
      - name: Two projects with bot coordination over SSH
        run: bash deploy/ops/test_remote_recovery.sh
      - name: Validate mock staging and separate VPS configuration
        run: |
          APP_DOMAIN=example.invalid docker compose -f compose.staging.yaml config --quiet
          APP_DOMAIN=example.invalid CORE_VPN_IP=10.77.0.1 docker compose -f compose.staging.yaml -f deploy/compose.core-private.yaml config --quiet
          CORE_VPN_IP=10.77.0.1 docker compose -f deploy/compose.bot-vps.yaml config --quiet
          APP_DOMAIN=example.invalid CORE_VPN_IP=10.77.0.1 docker compose -f compose.production.yaml -f deploy/compose.core-private.yaml -f deploy/compose.limits.yaml -f deploy/compose.pre-domain.yaml config --quiet
          CORE_VPN_IP=10.77.0.1 docker compose -f deploy/compose.bot-vps.yaml -f deploy/compose.bot-prepared.yaml config --quiet
          for script in deploy/host/*; do
            case "$script" in *.py|*.service|*.timer|*.conf) continue;; esac
            sh -n "$script"
          done

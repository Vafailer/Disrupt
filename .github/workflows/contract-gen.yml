name: Temporary contract generation
on:
  push:
    branches: [tmp/contract-gen-5]
permissions:
  contents: write
jobs:
  gen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          PYTHONPATH=. python scripts/export_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/integration-v1.openapi.json docs/integration-v1.yaml docs/integration-v1-examples.json
          git commit -m "generated contract" || echo nothing
          git push origin HEAD:tmp/contract-gen-5
